<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!-- Fragmento <head> común. Se usa así: th:replace="~{fragments/base :: head('Título')}" -->
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | GameShop4'">GameShop4</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .card-img-top { height: 300px; object-fit: cover; }
        .thumb { width: 60px; height: 80px; object-fit: cover; }
        .badge-genero { background-color: #ffc107; color: #000; font-size: .7rem; }
    </style>
</head>
</html>
