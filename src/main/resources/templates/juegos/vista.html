<!DOCTYPE html>
<!-- PASO 12: botón Comprar solo para USER (sec:authorize); lleva a /carrito/anadir. -->
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/base :: head('Lista de Juegos')}"></head>
<body>
<nav th:replace="~{fragments/header :: header}"></nav>

<!-- 2.2.2 (público) y 2.2.3 (USER: con botón Comprar) -->
<main class="container">
    <h1 class="text-center my-3">Lista de Juegos</h1>

    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-3">
        <div class="col" th:each="juego : ${listaJuegos}">
            <div class="card h-100">
                <img th:src="${juego.image}" class="card-img-top" th:alt="${juego.nombre}">

                <!-- Solo el USER logueado ve el botón; lo añade a la variable de sesión carrito -->
                <a sec:authorize="hasAuthority('USER')" class="btn btn-primary btn-sm rounded-0"
                   th:href="@{/carrito/anadir(id=${juego.idjuego})}">
                    <i class="bi bi-plus-circle"></i> Comprar
                </a>

                <div class="card-body">
                    <h6 class="card-title mb-1">
                        <span th:text="${juego.nombre}">Nombre</span>
                        <span class="badge badge-genero" th:text="${juego.genero?.nombre}">Género</span>
                    </h6>
                    <p class="card-text small" th:text="${juego.descripcion}">Descripción</p>
                </div>
                <div class="text-center pb-3">
                    <span class="badge bg-danger" th:text="'$ ' + ${juego.precio}">$ 0.0</span>
                </div>
            </div>
        </div>
    </div>
    <p th:if="${#lists.isEmpty(listaJuegos)}" class="text-center text-muted">No hay juegos para mostrar.</p>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
