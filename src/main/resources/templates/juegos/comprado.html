<!DOCTYPE html>
<!-- PASO 12: lista del USER; cada juego es un JuegosUserDto (getters = alias de la @Query). -->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head('Mis Juegos')}"></head>
<body>
<nav th:replace="~{fragments/header :: header}"></nav>

<!-- 2.3.3 Juegos comprados por el USER. Cada "juego" es un JuegosUserDto -->
<main class="container">
    <h1 class="text-center my-3">Lista de Juegos Comprados</h1>

    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-3">
        <div class="col" th:each="juego : ${listaJuegos}">
            <div class="card h-100">
                <img th:src="${juego.imageURL}" class="card-img-top" th:alt="${juego.nombre}">
                <div class="card-body">
                    <h6 class="card-title mb-1">
                        <span th:text="${juego.nombre}">Nombre</span>
                        <span class="badge badge-genero" th:text="${juego.genero}">Género</span>
                    </h6>
                    <p class="card-text small" th:text="${juego.descripcion}">Descripción</p>
                </div>
            </div>
        </div>
    </div>
    <p th:if="${#lists.isEmpty(listaJuegos)}" class="text-center text-muted">Aún no has comprado juegos.</p>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
