<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head('Editar Distribuidora')}"></head>
<body>
<nav th:replace="~{fragments/header :: header}"></nav>
<main class="container" style="max-width: 640px">
    <h2 class="my-3" th:text="${distribuidora.iddistribuidora == 0} ? 'Nueva Distribuidora' : 'Editar Distribuidora'">Distribuidora</h2>
    <form th:action="@{/distribuidoras/guardar}" method="post" th:object="${distribuidora}">
        <input type="hidden" th:field="*{iddistribuidora}">
        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" class="form-control" th:field="*{nombre}" th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{nombre}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Descripción</label>
            <textarea class="form-control" rows="3" th:field="*{descripcion}" th:classappend="${#fields.hasErrors('descripcion')} ? 'is-invalid'"></textarea>
            <div class="invalid-feedback" th:errors="*{descripcion}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Año de fundación</label>
            <input type="number" class="form-control" th:field="*{fundacion}">
        </div>
        <div class="mb-3">
            <label class="form-label">Web</label>
            <input type="text" class="form-control" th:field="*{web}">
        </div>
        <div class="mb-3">
            <label class="form-label">Sede</label>
            <select class="form-select" th:field="*{sede.idpais}">
                <option th:each="p : ${listaPaises}" th:value="${p.idpais}" th:text="${p.nombre}"></option>
            </select>
        </div>
        <a th:href="@{/distribuidoras/lista}" class="btn btn-secondary">Cancelar</a>
        <button type="submit" class="btn btn-primary">Guardar</button>
    </form>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
