<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head('Distribuidoras')}"></head>
<body>
<nav th:replace="~{fragments/header :: header}"></nav>
<main class="container">
    <h1 class="text-center my-3">Lista de Distribuidoras</h1>
    <div th:if="${msg}" class="alert alert-success" th:text="${msg}"></div>
    <div th:if="${msgError}" class="alert alert-danger" th:text="${msgError}"></div>
    <a th:href="@{/distribuidoras/editarFrm}" class="btn btn-primary mb-3"><i class="bi bi-plus-circle"></i> Nueva Distribuidora</a>
    <table class="table table-striped align-middle">
        <thead><tr><th>#</th><th>Nombre</th><th>Descripción</th><th>Fundación</th><th>Web</th><th>Sede</th><th></th></tr></thead>
        <tbody>
        <tr th:each="d, info : ${listaDistribuidoras}">
            <td th:text="${info.count}"></td>
            <td th:text="${d.nombre}"></td>
            <td class="small" th:text="${d.descripcion}"></td>
            <td th:text="${d.fundacion}"></td>
            <td><a th:href="${d.web}" th:text="${d.web}" target="_blank"></a></td>
            <td th:text="${d.sede?.nombre}"></td>
            <td class="text-nowrap">
                <a th:href="@{/distribuidoras/editarFrm(id=${d.iddistribuidora})}" class="btn btn-primary btn-sm"><i class="bi bi-pencil-square"></i></a>
                <a th:href="@{/distribuidoras/borrar(id=${d.iddistribuidora})}" class="btn btn-danger btn-sm"
                   onclick="return confirm('¿Borrar esta distribuidora?')"><i class="bi bi-trash"></i></a>
            </td>
        </tr>
        </tbody>
    </table>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
