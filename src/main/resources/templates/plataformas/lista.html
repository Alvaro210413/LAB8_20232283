<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head('Plataformas')}"></head>
<body>
<nav th:replace="~{fragments/header :: header}"></nav>
<main class="container">
    <h1 class="text-center my-3">Lista de Plataformas</h1>
    <div th:if="${msg}" class="alert alert-success" th:text="${msg}"></div>
    <div th:if="${msgError}" class="alert alert-danger" th:text="${msgError}"></div>
    <a th:href="@{/plataformas/editarFrm}" class="btn btn-primary mb-3"><i class="bi bi-plus-circle"></i> Nueva Plataforma</a>
    <table class="table table-striped align-middle">
        <thead><tr><th>#</th><th>Nombre</th><th>Descripción</th><th></th></tr></thead>
        <tbody>
        <tr th:each="p, info : ${listaPlataformas}">
            <td th:text="${info.count}"></td>
            <td th:text="${p.nombre}"></td>
            <td th:text="${p.descripcion}"></td>
            <td class="text-nowrap">
                <a th:href="@{/plataformas/editarFrm(id=${p.idplataforma})}" class="btn btn-primary btn-sm"><i class="bi bi-pencil-square"></i></a>
                <a th:href="@{/plataformas/borrar(id=${p.idplataforma})}" class="btn btn-danger btn-sm"
                   onclick="return confirm('¿Borrar esta plataforma?')"><i class="bi bi-trash"></i></a>
            </td>
        </tr>
        </tbody>
    </table>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
