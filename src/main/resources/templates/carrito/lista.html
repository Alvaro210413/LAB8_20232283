<!DOCTYPE html>
<!-- PASO 12: muestra el carrito de la sesión; botones a /carrito/compra y /carrito/borrar. -->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head('Carrito')}"></head>
<body>
<nav th:replace="~{fragments/header :: header}"></nav>

<!-- 2.4.2 Juegos en el carrito (variable de sesión "carrito"), por precio ascendente -->
<main class="container">
    <h1 class="text-center my-3">Carrito de Juegos</h1>

    <a th:href="@{/carrito/compra}" class="btn btn-success mb-3"
       th:classappend="${#lists.isEmpty(listaCarrito)} ? 'disabled'">
        <i class="bi bi-cart-check"></i> Comprar
    </a>

    <table class="table table-striped align-middle">
        <thead>
        <tr>
            <th>#</th><th></th><th>Nombre</th><th>Descripción</th><th>Plataforma</th>
            <th>Distribuidora</th><th>Precio (S/)</th><th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="juego, info : ${listaCarrito}">
            <td th:text="${info.count}">1</td>
            <td><img th:src="${juego.image}" class="thumb" alt=""></td>
            <td>
                <span th:text="${juego.nombre}"></span>
                <span class="badge badge-genero" th:text="${juego.genero?.nombre}"></span>
            </td>
            <td class="small" th:text="${juego.descripcion}"></td>
            <td th:text="${juego.plataforma?.nombre}"></td>
            <td th:text="${juego.distribuidora?.nombre}"></td>
            <td th:text="${juego.precio}"></td>
            <td>
                <a th:href="@{/carrito/borrar(id=${juego.idjuego})}" class="btn btn-danger btn-sm"><i class="bi bi-trash"></i></a>
            </td>
        </tr>
        </tbody>
    </table>
    <p th:if="${#lists.isEmpty(listaCarrito)}" class="text-center text-muted">Tu carrito está vacío.</p>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
