# #####################################################################################
#  TEORIA RESUMIDA
# #####################################################################################
# [T1] HTTP no tiene memoria: cada request llega "nuevo" y el servidor no sabe quien eres.
#      Por eso existen la SESION (recordar datos) y SPRING SECURITY (saber quien eres).
#
# [T2] SESION (HttpSession): un Map por usuario que vive en el servidor. El navegador
#      solo guarda la llave en la cookie JSESSIONID. Dura hasta el logout o 30 min sin uso.
#
# [T3] Uso: session.setAttribute("x", valor) / (Tipo) session.getAttribute("x").
#      En Thymeleaf se lee con ${session.x}. Ejemplo: usuario, carrito, ncarrito.
#
# [T4] Model dura 1 request; RedirectAttributes (flash) dura hasta 1 redirect;
#      HttpSession dura toda la sesion. Por eso el carrito va en sesion.
#
# [T5] SPRING SECURITY = una cadena de filtros (SecurityFilterChain) que corre ANTES
#      de tus controllers: si no estas logueado -> te manda al login; si tu rol no alcanza -> 403.
#
# [T6] AUTENTICACION = quien eres (login contra la BD).
#      AUTORIZACION = que puedes hacer (que rutas segun tu rol).
#
# [T7] El POST /processLogin NO tiene controller: lo atiende Spring. Usa las 2 queries:
#      1) correo, password, enabled (en ese orden)   2) correo, rol.
#
# [T8] BCrypt: la clave se guarda como hash ($2a$10$...). Spring hashea lo que escribes
#      y compara hashes, nunca texto plano. Por eso se declara el @Bean PasswordEncoder.
#
# [T9] Reglas: se leen de ARRIBA hacia ABAJO y gana la primera que coincide.
#      anyRequest().permitAll() va SIEMPRE al final.
#
# [T10] hasAuthority("ADMIN") compara literal. hasRole("ADMIN") busca "ROLE_ADMIN".
#       Como la BD guarda "ADMIN" sin prefijo, usamos hasAuthority.
#
# [T11] CSRF: Spring exige un token oculto en cada POST. th:action="@{...}" lo agrega solo.
#       Por eso el logout es un <form method="post">, no un <a href>.
#
# [T12] sec:authorize en HTML solo OCULTA botones; quien realmente BLOQUEA la ruta
#       es el SecurityFilterChain (paso 6c).
#
# [T13] El PDF (2022) usa WebSecurityConfigurerAdapter: se ELIMINO en Spring Boot 3.
#       Ahora: @Bean SecurityFilterChain (reglas/login) + @Bean UserDetailsManager (queries).
#       Cambios: antMatchers -> requestMatchers, authorizeRequests -> authorizeHttpRequests.
