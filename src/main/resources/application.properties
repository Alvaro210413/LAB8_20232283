# UserRepository: findByCorreo() es un "query method" (Spring arma el SQL por el nombre).
# JuegosRepository: @Query nativa que devuelve JuegosUserDto y otra para los juegos no comprados.
# -------------------------------------------------------------------------------------
# Tipos de consulta que puedes usar en un repository (para el examen):
#  a) Heredados de JpaRepository: findAll(), findById(), save(), deleteById(), findAll(Sort)
#  b) Query methods por nombre: findByCorreo, findByNombreContaining, findByPrecioLessThan...
#  c) @Query JPQL (usa nombres de CLASES/atributos) o @Query(nativeQuery=true) (SQL puro)
#  d) Proyecciones: interface con getters (como JuegosUserDto); los alias del SQL = getters
#  e) Para INSERT/UPDATE/DELETE con @Query: agregar @Modifying y @Transactional
# =====================================================================================

