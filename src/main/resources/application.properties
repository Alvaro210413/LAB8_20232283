spring.application.name=lab8
server.port=8080
# context-path: la app se abre en http://localhost:8080/gameshop4 (como en el PDF)
server.servlet.context-path=/gameshop4

spring.datasource.url=jdbc:mysql://localhost:3306/gameshop4?serverTimezone=America/Lima
# >>> CAMBIA ESTAS DOS LINEAS por tu usuario y contrasena de MySQL <<<
spring.datasource.username=root
spring.datasource.password=root

# none = Hibernate NO crea ni modifica tablas: usa las que ya creo el script SQL
spring.jpa.hibernate.ddl-auto=none
# Muestra en la consola los SQL que ejecuta JPA (sirve para depurar)
spring.jpa.show-sql=true


